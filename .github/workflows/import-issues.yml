name: Import Issues from CSV

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: 'Path to CSV file to import (e.g., tasks.csv)'
        required: true
        default: 'tasks.csv'

jobs:
  import:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run import script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 import_issues.py ${{ github.event.inputs.csv_file }} ${{ github.repository_owner }} ${{ github.event.repository.name }}
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: import-logs
          path: .
          retention-days: 7